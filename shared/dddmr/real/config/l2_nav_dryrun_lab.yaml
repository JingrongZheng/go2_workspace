p2p_move_base:
  ros__parameters:
    controller_frequency: 10.0
    planner_patience: 10.0
    oscillation_distance: 5.0
    oscillation_angle: 1.0
    oscillation_patience: 15.0
    controller_patience: 10.0
    no_plan_retry_num: 10
    waiting_patience: 10.0
    use_sim_time: false

global_plan_manager:
  ros__parameters:
    global_planner_action_name: get_dwa_plan
    global_plan_query_frequency: 2.0
    use_sim_time: false

mcl_ip:
  ros__parameters:
    laser:
      odom_type: wheel_odometry
      base_ground_frame: base_footprint
      num_vertical_scans: 96
      num_horizontal_scans: 360
      vertical_angle_bottom: -90.0
      vertical_angle_top: 90.0
      scan_period: 0.0
      odom_child_frame: base_link
    imageProjection:
      segment_valid_point_num: 5
      segment_valid_line_num: 2
      segment_theta: 60.0
      minimum_detection_range: 0.1
      maximum_detection_range: 20.0
      distance_for_patch_between_rings: 0.3
      stitcher_num: 1
      trt_model_path: ''
      projected_image_stack_size: 1
      ground_fov_bottom: -1.5707963
      ground_fov_top: -0.03
      ground_positive_start: 0.0
      ground_positive_stop: 3.1415926
      ground_negative_start: 0.0
      ground_negative_stop: -3.1415926
      patch_first_ring_to_baselink: false
      ground_slope_tolerance: 0.2617994
      ground_dz_tolerance: 0.05
    use_sim_time: false

mcl_fa:
  ros__parameters:
    featureAssociation:
      edge_threshold: 0.1
      surf_threshold: 0.1
      nearest_feature_search_distance: 3.0
    mapping:
      to_map_optimization: false
    use_sim_time: false

dddmr_pg_map_server_manager:
  ros__parameters:
    maps: [map1]

map1:
  ros__parameters:
    pose_graph_dir: /saved-map
    complete_map_voxel_size: 0.15

sub_maps:
  ros__parameters:
    pg_map_server_name: map1
    sub_map_search_radius: 30.0
    sub_map_warmup_trigger_distance: 15.0

mcl_3dl:
  ros__parameters:
    init_x: 0.0
    init_y: 0.0
    init_z: 0.0
    init_roll: 0.0
    init_pitch: 0.0
    init_yaw: 0.0
    init_var_x: 1.5
    init_var_y: 1.5
    init_var_z: 0.3
    init_var_roll: 0.1
    init_var_pitch: 0.1
    init_var_yaw: 0.4
    map_frame: map
    ground_frame: base_footprint
    odom_frame: odom
    map_downsample_x: 0.1
    map_downsample_y: 0.1
    map_downsample_z: 0.1
    num_particles: 80
    resample_var_x: 0.15
    resample_var_y: 0.15
    resample_var_z: 0.1
    resample_var_yaw: 0.1
    resample_var_pitch: 0.1
    resample_var_roll: 0.1
    expansion_var_x: 0.3
    expansion_var_y: 0.3
    expansion_var_z: 0.2
    expansion_var_roll: 0.1
    expansion_var_pitch: 0.1
    expansion_var_yaw: 0.2
    match_ratio_thresh: 0.0
    euc_cluster_distance: 0.8
    euc_cluster_min_size: 3
    euc_cluster_max_size: 2400
    knn_num_of_ground_normals: 20
    update_min_d: 0.08
    update_min_a: 0.08
    odom_err_lin_lin: 0.3
    odom_err_lin_ang: 0.2
    odom_err_ang_lin: 0.2
    odom_err_ang_ang: 0.3
    odom_err_integ_lin_tc: 5.0
    odom_err_integ_ang_tc: 10.0
    lpf_step: 2.0
    acc_lpf_step: 128.0
    jump_dist: 1.0
    jump_ang: 1.57
    bias_var_dist: 2.0
    bias_var_ang: 1.57
    tf_tolerance: 0.15
    publish_tf: true
    use_sim_time: false
    likelihood:
      num_points_global: 8
      match_dist_min: 0.3
      match_dist_flat: 0.05
      threshold_for_trusted_ground: 6
      radius_of_ground_search: 1.0

local_planner:
  ros__parameters:
    odom_topic: odom
    forward_prune: 3.0
    backward_prune: 1.0
    heading_tracking_distance: 0.5
    heading_align_angle: 0.5
    prune_plane_timeout: 3.0
    xy_goal_tolerance: 0.45
    yaw_goal_tolerance: 6.28
    controller_frequency: 10.0
    cuboid:
      flb: [0.385, 0.1705, -0.316868]
      frb: [0.385, -0.1705, -0.316868]
      flt: [0.385, 0.1705, 0.123132]
      frt: [0.385, -0.1705, 0.123132]
      blb: [-0.385, 0.1705, -0.316868]
      brb: [-0.385, -0.1705, -0.316868]
      blt: [-0.385, 0.1705, 0.123132]
      brt: [-0.385, -0.1705, 0.123132]
    use_sim_time: false

recovery_behaviors:
  ros__parameters:
    plugins: [rotate_inplace]
    rotate_inplace:
      plugin: recovery_behaviors::RotateInPlaceBehavior
      frequency: 10.0
      tolerance: 0.3
      trajectory_generator_name: differential_drive_rotate_inplace
    use_sim_time: false

trajectory_generators:
  ros__parameters:
    plugins: [differential_drive_simple, differential_drive_rotate_inplace, differential_drive_rotate_shortest_angle]
    differential_drive_rotate_shortest_angle:
      plugin: trajectory_generators::DDRotateInplaceTheory
      controller_frequency: 10.0
      rotation_speed: 0.5
      cuboid:
        flb: [0.385, 0.1705, -0.316868]
        frb: [0.385, -0.1705, -0.316868]
        flt: [0.385, 0.1705, 0.123132]
        frt: [0.385, -0.1705, 0.123132]
        blb: [-0.385, 0.1705, -0.316868]
        brb: [-0.385, -0.1705, -0.316868]
        blt: [-0.385, 0.1705, 0.123132]
        brt: [-0.385, -0.1705, 0.123132]
    differential_drive_rotate_inplace:
      plugin: trajectory_generators::DDRotateInplaceTheory
      controller_frequency: 10.0
      rotation_speed: 0.5
      cuboid:
        flb: [0.385, 0.1705, -0.316868]
        frb: [0.385, -0.1705, -0.316868]
        flt: [0.385, 0.1705, 0.123132]
        frt: [0.385, -0.1705, 0.123132]
        blb: [-0.385, 0.1705, -0.316868]
        brb: [-0.385, -0.1705, -0.316868]
        blt: [-0.385, 0.1705, 0.123132]
        brt: [-0.385, -0.1705, 0.123132]
    differential_drive_simple:
      plugin: trajectory_generators::DDSimpleTrajectoryGeneratorTheory
      max_vel_x: 0.35
      min_vel_x: 0.15
      max_vel_theta: 0.8
      min_vel_theta: 0.2
      acc_lim_x: 1.0
      acc_lim_theta: 1.5
      deceleration_ratio: 2.0
      max_motor_shaft_rpm: 3000.0
      wheel_diameter: 0.16
      gear_ratio: 1.0
      robot_radius: 0.25
      controller_frequency: 10.0
      sim_time: 1.5
      linear_x_sample: 5.0
      angular_z_sample: 9.0
      sim_granularity: 0.05
      angular_sim_granularity: 0.025
      cuboid:
        flb: [0.385, 0.1705, -0.316868]
        frb: [0.385, -0.1705, -0.316868]
        flt: [0.385, 0.1705, 0.123132]
        frt: [0.385, -0.1705, 0.123132]
        blb: [-0.385, 0.1705, -0.316868]
        brb: [-0.385, -0.1705, -0.316868]
        blt: [-0.385, 0.1705, 0.123132]
        brt: [-0.385, -0.1705, 0.123132]
    use_sim_time: false

mpc_critics:
  ros__parameters:
    plugins: [collision, stick_path, pure_pursuit, toward_global_plan, collision_rotate, collision_rotate_shortest, prefer_rotate_shortest]
    collision:
      plugin: mpc_critics::CollisionModel
      trajectory_generator: differential_drive_simple
      weight: 1.0
    stick_path:
      plugin: mpc_critics::StickPathModel
      trajectory_generator: differential_drive_simple
      weight: 0.1
    pure_pursuit:
      plugin: mpc_critics::PurePursuitModel
      trajectory_generator: differential_drive_simple
      translation_weight: 1.0
      orientation_weight: 0.01
    toward_global_plan:
      plugin: mpc_critics::TowardGlobalPlanModel
      trajectory_generator: differential_drive_simple
      weight: 1.0
    collision_rotate:
      plugin: mpc_critics::CollisionModel
      trajectory_generator: differential_drive_rotate_inplace
      weight: 1.0
    collision_rotate_shortest:
      plugin: mpc_critics::CollisionModel
      trajectory_generator: differential_drive_rotate_shortest_angle
      weight: 1.0
    prefer_rotate_shortest:
      plugin: mpc_critics::ShortestAngleModel
      trajectory_generator: differential_drive_rotate_shortest_angle
      weight: 1.0
    use_sim_time: false

perception_3d_local:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    max_obstacle_distance: 9999.0
    inscribed_radius: 0.48
    inflation_descending_rate: 2.0
    inflation_radius: 1.20
    sensors_collected_frequency: 10.0
    plugins: [map, path_blocked_strategy, lidar]
    map:
      plugin: perception_3d::StaticLayer
      is_local_planner: true
      mapping_mode: false
      map_topic: map1/mapcloud
      ground_topic: map1/mapground
    path_blocked_strategy:
      plugin: perception_3d::PathBlockedStrategy
      check_radius: 0.35
    lidar:
      plugin: perception_3d::MultiLayerSpinningLidar
      is_local_planner: true
      topic: segmented_cloud_pure
      pub_gbl_marking_for_visualization: false
      vertical_FOV_top: 60.0
      vertical_FOV_bottom: -60.0
      scan_effective_positive_start: 0.0
      scan_effective_positive_end: 180.0
      scan_effective_negative_start: 0.0
      scan_effective_negative_end: -180.0
      resolution: 0.05
      height_resolution: 0.05
      marking_height: 0.60
      marking_minimum_height: -0.25
      perception_window_size: 3.0
      segmentation_ignore_ratio: 0.90
      expected_sensor_time: 0.25
    use_sim_time: false

perception_3d_global:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    max_obstacle_distance: 9999.0
    inscribed_radius: 0.48
    inflation_descending_rate: 2.0
    inflation_radius: 1.20
    sensors_collected_frequency: 10.0
    plugins: [map, lidar]
    dgraph_publish_frequency: 1.0
    map:
      plugin: perception_3d::StaticLayer
      is_local_planner: false
      use_adaptive_connection: false
      adaptive_connection_number: 20
      radius_of_ground_connection: 1.0
      intensity_search_radius: 1.5
      intensity_search_punish_weight: 0.1
      static_imposing_radius: 1.5
      map_topic: map1/mapcloud
      ground_topic: map1/mapground
      support:
        mapping_mode: false
        enable_edge_detection: true
        generate_static_graph: false
    lidar:
      plugin: perception_3d::MultiLayerSpinningLidar
      is_local_planner: false
      topic: segmented_cloud_pure
      pub_gbl_marking_for_visualization: true
      vertical_FOV_top: 60.0
      vertical_FOV_bottom: -60.0
      scan_effective_positive_start: 0.0
      scan_effective_positive_end: 180.0
      scan_effective_negative_start: 0.0
      scan_effective_negative_end: -180.0
      euclidean_cluster_extraction_tolerance: 0.1
      euclidean_cluster_extraction_min_cluster_size: 1
      xy_resolution: 0.05
      height_resolution: 0.05
      marking_height: 0.60
      marking_minimum_height: -0.25
      perception_window_size: 4.0
      segmentation_ignore_ratio: 1.1
      expected_sensor_time: 0.25
    use_sim_time: false

global_planner:
  ros__parameters:
    turning_weight: 0.1
    a_star_expanding_radius: 0.4
    enable_detail_log: false
    use_sim_time: false

dynamic_window_aware_global_planner:
  ros__parameters:
    look_ahead_distance: 2.0
    recompute_frequency: 5.0
    use_sim_time: false
