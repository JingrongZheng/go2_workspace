lego_loam_ip:
  ros__parameters:
    laser:
      odom_type: wheel_odometry
      base_ground_frame: base_footprint
      num_vertical_scans: 96
      num_horizontal_scans: 360
      vertical_angle_bottom: -90.0
      vertical_angle_top: 90.0
      scan_period: 0.0
      odom_child_frame: base_link
    imageProjection:
      segment_valid_point_num: 5
      segment_valid_line_num: 2
      segment_theta: 60.0
      minimum_detection_range: 0.1
      maximum_detection_range: 20.0
      distance_for_patch_between_rings: 0.3
      stitcher_num: 1
      trt_model_path: ''
      projected_image_stack_size: 1
      ground_fov_bottom: -1.5707963
      ground_fov_top: -0.03
      ground_positive_start: 0.0
      ground_positive_stop: 3.1415926
      ground_negative_start: 0.0
      ground_negative_stop: -3.1415926
      patch_first_ring_to_baselink: false
      ground_slope_tolerance: 0.2617994
      ground_dz_tolerance: 0.05
    use_sim_time: false
lego_loam_fa:
  ros__parameters:
    featureAssociation:
      edge_threshold: 0.1
      surf_threshold: 0.1
      nearest_feature_search_distance: 3.0
    mapping:
      to_map_optimization: true
    use_sim_time: false
lego_loam_mo:
  ros__parameters:
    mapping:
      distance_between_key_frame: 0.25
      angle_between_key_frame: 0.25
      enable_loop_closure: false
      surrounding_keyframe_search_num: 50
      history_keyframe_search_radius: 15.0
      history_keyframe_search_num: 5
      history_keyframe_fitness_score: 0.5
      ground_voxel_size: 0.4
      broadcast_external_odom_tf: false
      generate_testing_pg: false
    use_sim_time: false
lego_loam_map_visualization:
  ros__parameters:
    use_sim_time: false
    ground_voxel_size: 0.15
    ground_edge_threshold_num: 60
p2p_move_base:
  ros__parameters:
    controller_frequency: 10.0
    planner_patience: 10.0
    oscillation_distance: 5.0
    oscillation_angle: 1.0
    oscillation_patience: 15.0
    controller_patience: 10.0
    no_plan_retry_num: 10
    waiting_patience: 10.0
    use_sim_time: false
global_plan_manager:
  ros__parameters:
    global_planner_action_name: get_plan
    global_plan_query_frequency: -1.0
    use_sim_time: false
